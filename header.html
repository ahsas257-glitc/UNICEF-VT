<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNICEF Vocational Training — Header</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: 320px;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #eef2f7;
    }

    .dashboard-header {
      position: relative;
      min-height: 180px;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(105deg, #4058ad 0%, #3978bd 54%, #55b3df 100%);
    }

    .dashboard-header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle at 86% 18%,
        rgba(255, 255, 255, 0.13),
        transparent 25%
      );
    }

    .header-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 300px;
      align-items: center;
      gap: 24px;
      width: 100%;
      min-height: 180px;
      padding: 0 26px 0 42px;
    }

    .logo-shell {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .brand-logo {
      display: block;
      width: 138px;
      height: 112px;
      object-fit: contain;
      filter: drop-shadow(0 5px 10px rgba(17, 45, 91, 0.22));
    }

    .title-copy {
      min-width: 0;
      text-align: center;
    }

    .title-copy h1 {
      font-size: clamp(25px, 1.7vw, 32px);
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }

    .title-copy p {
      margin-top: 11px;
      font-size: 19px;
      line-height: 1.3;
      opacity: 0.92;
    }

    .publication-badge {
      display: flex;
      align-items: center;
      justify-self: end;
      gap: 11px;
      padding: 13px 22px;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: 0 6px 18px rgba(26, 56, 120, 0.12);
      font-size: 16px;
      font-weight: 650;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
    }

    @media (max-width: 1200px) {
      .header-inner {
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 16px;
        padding: 18px 26px;
      }

      .brand-logo {
        width: 110px;
        height: 90px;
      }

      .publication-badge {
        grid-column: 1 / 3;
        justify-self: end;
        margin-top: -14px;
        padding: 9px 15px;
        font-size: 13px;
      }

      .title-copy h1 {
        font-size: clamp(18px, 2.5vw, 28px);
      }

      .title-copy p {
        font-size: 16px;
      }
    }

    @media (max-width: 700px) {
      .dashboard-header,
      .header-inner {
        min-height: 0;
      }

      .header-inner {
        grid-template-columns: 78px minmax(0, 1fr);
        gap: 12px;
        padding: 14px 18px;
      }

      .brand-logo {
        width: 74px;
        height: 68px;
      }

      .title-copy {
        text-align: left;
      }

      .title-copy h1 {
        font-size: clamp(14px, 3.2vw, 20px);
        white-space: normal;
      }

      .title-copy p {
        margin-top: 6px;
        font-size: 12px;
      }

      .publication-badge {
        grid-column: 1 / 3;
        margin-top: -2px;
        padding: 7px 11px;
        font-size: 11px;
      }
    }

    @media (max-width: 430px) {
      .header-inner {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .title-copy {
        text-align: center;
      }

      .publication-badge {
        grid-column: 1;
        justify-self: center;
        max-width: 100%;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <div class="header-inner">
      <div class="logo-shell">
        <img class="brand-logo" src="assets/ppc-logo.png" alt="PPC logo">
      </div>

      <div class="title-copy">
        <h1>UNICEF Vocational Training — Monitoring Dashboard</h1>
        <p>VT Project · Third-Party Monitoring · Afghanistan</p>
      </div>

      <div class="publication-badge" aria-label="Dashboard publication details">
        <span>Data extract: 24 Aug 2026</span>
        <span class="badge-dot" aria-hidden="true"></span>
        <span>Prepared by PPC</span>
      </div>
    </div>
  </header>
</body>
</html>
